name: BIST Bot

on:
  schedule:
    - cron: '30 1 * * 1-5'    # Türkiye saatiyle 07:00
    - cron: '0 5 * * 1-5'    # Türkiye saatiyle 12:00
    - cron: '0 8 * * 1-5'   # Türkiye saatiyle 16:00
    - cron: '0 10 * * 1-5'    # Türkiye saatiyle 18:30
  workflow_dispatch:  # Manuel çalıştırma için

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install yfinance requests pandas numpy
    
    - name: Run bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python bist_bot.py
      
